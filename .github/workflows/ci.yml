name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Engine purity contract (import-linter)
        run: lint-imports
      - name: Tests
        run: pytest

  # frontend job intentionally absent in Phase 1 — the Vite scaffold lands in Phase 8.
